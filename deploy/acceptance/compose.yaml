# SYNTHETIC ONLY. Separate project/storage; never use existing company databases.
services:
  postgres:
    image: postgres:16-alpine
    command: [postgres, -c, wal_level=logical, -c, max_replication_slots=4, -c, max_wal_senders=4]
    environment:
      POSTGRES_USER: acceptance
      POSTGRES_PASSWORD: synthetic-only-password
      POSTGRES_DB: organization_acceptance
    ports: [127.0.0.1:15436:5432]
    tmpfs: [/var/lib/postgresql/data]
  kafka:
    image: apache/kafka:4.0.2
    ports: [127.0.0.1:19092:19092]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://127.0.0.1:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
  clickhouse:
    image: clickhouse/clickhouse-server:25.8.12.129
    environment:
      CLICKHOUSE_USER: acceptance
      CLICKHOUSE_PASSWORD: synthetic-only-password
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: [127.0.0.1:18123:8123]
    tmpfs: [/var/lib/clickhouse]
  connect:
    image: quay.io/debezium/connect:3.2.4.Final
    profiles: [cdc]
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GROUP_ID: synthetic-connect
      CONFIG_STORAGE_TOPIC: synthetic.connect.config
      OFFSET_STORAGE_TOPIC: synthetic.connect.offset
      STATUS_STORAGE_TOPIC: synthetic.connect.status
      CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR: 1
      CONNECT_STATUS_STORAGE_REPLICATION_FACTOR: 1
    ports: [127.0.0.1:18083:8083]
