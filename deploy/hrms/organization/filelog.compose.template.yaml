# Opt-in separate sidecar on the SOURCE host, one explicit service/tenant.
# Never mount /var/lib/docker/containers wholesale or the Docker socket.
services:
  source-filelog:
    image: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.162.0@sha256:39923a8e431bd1f57be82411999d389fcfe40857492e4365456d97a4c1f74be6
    command: [--config=/etc/otel/filelog.yaml]
    restart: unless-stopped
    read_only: true
    volumes:
      - ./otel-filelog.template.yaml:/etc/otel/filelog.yaml:ro
      - type: bind
        source: ${APPROVED_SERVICE_DOCKER_JSON_LOG:?exact allowlisted file only}
        target: /var/log/kabipay/approved-service.json.log
        read_only: true
      - type: bind
        source: ${SOURCE_FILELOG_STATE:?explicit existing collector checkpoint directory}
        target: /var/lib/otelcol/filelog
        bind: {create_host_path: false}
      - type: bind
        source: ${SOURCE_FILELOG_SECRETS:?explicit existing collector TLS directory}
        target: /run/secrets
        read_only: true
        bind: {create_host_path: false}
    environment:
      SOURCE_SERVICE_NAME: ${SOURCE_SERVICE_NAME:?fixed service identity}
      SOURCE_TENANT_ID: ${SOURCE_TENANT_ID:?fixed company UUID, never read from log}
      OTEL_EXPORT_ENDPOINT: ${OTEL_EXPORT_ENDPOINT:?private diagnostics endpoint}
    networks: [observability_egress]
networks:
  observability_egress:
    external: true
    name: ${OBSERVABILITY_NETWORK:?existing private network}
